name: tests

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: coordinator self-test
        run: python coordinator.py --self-test
      - name: dashboard self-test
        run: python dashboard.py --self-test
      - name: notify self-test
        run: python selftest_notify.py
