name: tests

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
      HAWK_SKIP_LIVE_HW: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: coordinator self-test
        if: always()
        run: python tests/selftest_coordinator.py
      - name: dashboard self-test
        if: always()
        run: python tests/selftest_dashboard.py
      - name: notify self-test
        if: always()
        run: python tests/selftest_notify.py
      - name: linux probes self-test
        if: always()
        run: python tests/selftest_linux.py
      - name: install the package (pip install .)
        if: always()
        run: pip install .
      - name: "smoke (installed hawk: init, dry-run poll, dashboard endpoints)"
        if: always()
        shell: bash
        run: |
          export COORD_HOME="$RUNNER_TEMP/hawk-home"
          mkdir -p "$COORD_HOME"
          cd "$RUNNER_TEMP"   # run the installed package, not the checkout
          hawk --version
          hawk init
          test -f "$COORD_HOME/config.json"
          hawk poll --dry-run
          hawk dashboard --port 8799 > "$RUNNER_TEMP/dash.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8799/ && break; sleep 1; done
          for path in / /api/state /api/timeline; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://127.0.0.1:8799$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { cat "$RUNNER_TEMP/dash.log"; exit 1; }
          done
